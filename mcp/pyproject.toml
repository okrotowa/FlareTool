[project]
name = "tfstate-health"
version = "0.1.0"
description = "Read-only MCP server that lists resources owned by a Terraform state."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tfstate-health = "tfstate_health.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
